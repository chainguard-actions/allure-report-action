name: Test allure report generation with custom report URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up allure-results with sample test data
        run: |
          mkdir -p allure-results
          cat > allure-results/test-result.json << 'EOF'
          {
            "uuid": "cccccccc-dddd-eeee-ffff-aaaaaaaaaaaa",
            "historyId": "custom-url-test-id",
            "name": "Custom URL Test",
            "status": "passed",
            "stage": "finished",
            "start": 1700000000000,
            "stop": 1700000001000
          }
          EOF

      - name: Set up empty gh-pages directory
        run: |
          mkdir -p gh-pages/last-history

      - id: action
        uses: .
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: '20'
          github_run_num: '77'
          github_run_id: '7777777'
          github_repo: 'test-owner/test-repo'
          github_repo_owner: 'test-owner'
          github_tests_repo: 'test-owner/test-repo'
          github_server_url: 'https://github.com'
          report_url: 'https://reports.example.com/allure'
          report_name: 'My Custom Report'

      - name: Assert allure-report was generated
        run: |
          echo "Checking allure-report directory..."
          if [ ! -d "$GITHUB_WORKSPACE/allure-report" ]; then
            echo "FAIL: allure-report directory not found"
            exit 1
          fi
          echo "PASS: allure-report directory exists"

      - name: Assert allure-history index.html uses custom URL
        run: |
          echo "Checking allure-history/index.html for custom URL..."
          if [ ! -f "$GITHUB_WORKSPACE/allure-history/index.html" ]; then
            echo "FAIL: allure-history/index.html not found"
            exit 1
          fi
          CONTENT=$(cat "$GITHUB_WORKSPACE/allure-history/index.html")
          echo "Content: $CONTENT"
          if echo "$CONTENT" | grep -q "reports.example.com/allure"; then
            echo "PASS: index.html contains custom report URL"
          else
            echo "FAIL: index.html does not contain custom report URL"
            exit 1
          fi

      - name: Assert executor.json was created with custom report name
        run: |
          echo "Checking executor.json in allure-results..."
          # executor.json is moved into allure-results before allure generate runs
          # After generation it may be in allure-report; check allure-report for report name
          if [ -f "$GITHUB_WORKSPACE/allure-report/index.html" ]; then
            echo "PASS: allure-report/index.html exists (report was generated)"
          else
            echo "FAIL: allure-report/index.html not found"
            exit 1
          fi

      - name: Assert allure-history run folder exists
        run: |
          echo "Checking allure-history/77 directory..."
          if [ ! -d "$GITHUB_WORKSPACE/allure-history/77" ]; then
            echo "FAIL: allure-history/77 directory not found"
            exit 1
          fi
          echo "PASS: allure-history/77 directory exists"
