name: Test allure report with custom report name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare allure-results directory
        run: |
          mkdir -p allure-results
          cat > allure-results/sample-result.json << 'EOF'
          {
            "uuid": "cccccccc-dddd-eeee-ffff-000000000000",
            "historyId": "report-name-test-history-id",
            "name": "Report Name Test",
            "status": "passed",
            "stage": "finished",
            "start": 1700000000000,
            "stop": 1700000001000
          }
          EOF

      - name: Prepare empty gh-pages directory
        run: |
          mkdir -p gh-pages

      - id: action
        uses: .
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: '20'
          github_run_num: '55'
          github_run_id: '5555555555'
          github_repo: 'test-owner/test-repo'
          github_repo_owner: 'test-owner'
          github_tests_repo: 'test-owner/test-repo'
          github_server_url: 'https://github.com'
          report_name: 'My Custom Allure Report'

      - name: Assert allure-report was generated
        run: |
          echo "Checking allure-report directory..."
          if [ ! -d "allure-report" ]; then
            echo "FAIL: allure-report directory was not created"
            exit 1
          fi
          echo "PASS: allure-report directory exists"

      - name: Assert allure-report contains index.html
        run: |
          echo "Checking allure-report/index.html..."
          if [ ! -f "allure-report/index.html" ]; then
            echo "FAIL: allure-report/index.html was not created"
            exit 1
          fi
          echo "PASS: allure-report/index.html exists"

      - name: Assert allure-history run number subdir exists
        run: |
          echo "Checking allure-history/55 directory..."
          if [ ! -d "allure-history/55" ]; then
            echo "FAIL: allure-history/55 directory was not created"
            exit 1
          fi
          echo "PASS: allure-history/55 directory exists"

      - name: Assert report widgets contain custom report name
        run: |
          echo "Checking for custom report name in generated report..."
          # The report name appears in the widgets/summary.json file
          SUMMARY_FILE="allure-report/widgets/summary.json"
          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "FAIL: $SUMMARY_FILE not found"
            exit 1
          fi
          CONTENT=$(cat "$SUMMARY_FILE")
          echo "Summary content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "My Custom Allure Report"; then
            echo "FAIL: summary.json does not contain custom report name"
            exit 1
          fi
          echo "PASS: summary.json contains custom report name"
