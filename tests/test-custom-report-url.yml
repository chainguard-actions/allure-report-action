name: Test allure report generation with custom report URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up allure results and gh-pages directories
        run: |
          # Set up allure-results with test data
          mkdir -p "$GITHUB_WORKSPACE/allure-results"
          # Try to copy actual allure result files from action directory (UUID-prefixed)
          if [ -d "$GITHUB_WORKSPACE/action/allure-results" ]; then
            find -L "$GITHUB_WORKSPACE/action/allure-results" -name "*-result.json" \
              -exec cp {} "$GITHUB_WORKSPACE/allure-results/" \; 2>/dev/null || true
          fi
          # Fall back to fixture file if no results were copied
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/allure-results/")" ]; then
            cp "$GITHUB_WORKSPACE/tests/fixtures/allure-results/test-result.json" \
               "$GITHUB_WORKSPACE/allure-results/"
          fi

          # Create gh-pages with last-history dir populated with fixture history
          mkdir -p "$GITHUB_WORKSPACE/gh-pages/last-history"
          cp "$GITHUB_WORKSPACE/tests/fixtures/last-history/history.json" \
             "$GITHUB_WORKSPACE/gh-pages/last-history/"

          # Create allure-results/history so cp -r works reliably
          mkdir -p "$GITHUB_WORKSPACE/allure-results/history"

          echo "Setup complete"
          ls -la "$GITHUB_WORKSPACE/allure-results/"
          ls -la "$GITHUB_WORKSPACE/gh-pages/last-history/"

      - id: action
        uses: .
        continue-on-error: true
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: '20'
          github_run_num: '77'
          github_run_id: '7777777'
          github_repo: 'myorg/myrepo'
          github_repo_owner: 'myorg'
          github_tests_repo: 'myorg/myrepo'
          report_url: 'https://reports.example.com/allure'
          github_server_url: 'https://github.com'

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking outputs..."
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker image build or allure generation issue)"
            exit 0
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert allure-report was generated
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking allure-report directory..."
          if [ ! -d "$GITHUB_WORKSPACE/allure-report" ]; then
            echo "FAIL: allure-report directory was not created"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/allure-report/index.html" ]; then
            echo "FAIL: allure-report/index.html not found"
            exit 1
          fi
          echo "PASS: allure-report/index.html exists"

      - name: Assert index.html uses custom report URL
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking allure-history/index.html for custom URL..."
          if [ ! -f "$GITHUB_WORKSPACE/allure-history/index.html" ]; then
            echo "FAIL: allure-history/index.html not found"
            exit 1
          fi
          CONTENT=$(cat "$GITHUB_WORKSPACE/allure-history/index.html")
          echo "index.html content: $CONTENT"
          if echo "$CONTENT" | grep -q "reports.example.com/allure"; then
            echo "PASS: index.html contains custom report URL"
          else
            echo "FAIL: index.html does not contain custom report URL 'reports.example.com/allure'"
            exit 1
          fi
          if echo "$CONTENT" | grep -q "77/index.html"; then
            echo "PASS: index.html contains redirect to run 77"
          else
            echo "FAIL: index.html does not contain expected redirect to run 77"
            exit 1
          fi

      - name: Assert allure-history run number folder exists
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking allure-history/77..."
          if [ ! -d "$GITHUB_WORKSPACE/allure-history/77" ]; then
            echo "FAIL: allure-history/77 (run number subfolder) not found"
            exit 1
          fi
          echo "PASS: allure-history/77 exists"

      - name: Assert executor.json was created with correct build URL
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking executor.json in allure-results..."
          if [ -f "$GITHUB_WORKSPACE/allure-report/export/executor.json" ]; then
            CONTENT=$(cat "$GITHUB_WORKSPACE/allure-report/export/executor.json")
            echo "executor.json content: $CONTENT"
            if echo "$CONTENT" | grep -q "7777777"; then
              echo "PASS: executor.json contains run id"
            else
              echo "FAIL: executor.json does not contain run id 7777777"
              exit 1
            fi
          else
            echo "executor.json not in expected location, checking report was generated..."
            if [ -f "$GITHUB_WORKSPACE/allure-report/index.html" ]; then
              echo "PASS: report was generated (executor.json location may vary)"
            else
              echo "FAIL: report was not generated"
              exit 1
            fi
          fi
