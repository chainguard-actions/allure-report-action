name: Test allure report with custom report URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare allure-results directory
        run: |
          mkdir -p allure-results
          cat > allure-results/sample-result.json << 'EOF'
          {
            "uuid": "aaaaaaaa-1111-2222-3333-bbbbbbbbbbbb",
            "historyId": "custom-url-test-history-id",
            "name": "Custom URL Test",
            "status": "passed",
            "stage": "finished",
            "start": 1700000000000,
            "stop": 1700000001000
          }
          EOF

      - name: Prepare empty gh-pages directory
        run: |
          mkdir -p gh-pages

      - id: action
        uses: .
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: '20'
          github_run_num: '77'
          github_run_id: '7777777777'
          github_repo: 'test-owner/test-repo'
          github_repo_owner: 'test-owner'
          github_tests_repo: 'test-owner/test-repo'
          github_server_url: 'https://github.com'
          report_url: 'https://reports.example.com/allure'

      - name: Assert allure-report was generated
        run: |
          echo "Checking allure-report directory..."
          if [ ! -d "allure-report" ]; then
            echo "FAIL: allure-report directory was not created"
            exit 1
          fi
          echo "PASS: allure-report directory exists"

      - name: Assert allure-history index.html uses custom URL
        run: |
          echo "Checking allure-history/index.html for custom URL..."
          if [ ! -f "allure-history/index.html" ]; then
            echo "FAIL: allure-history/index.html was not created"
            exit 1
          fi
          CONTENT=$(cat allure-history/index.html)
          echo "Content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "reports.example.com/allure"; then
            echo "FAIL: index.html does not contain custom report URL"
            exit 1
          fi
          echo "PASS: index.html contains custom report URL"

      - name: Assert allure-history run number subdir exists
        run: |
          echo "Checking allure-history/77 directory..."
          if [ ! -d "allure-history/77" ]; then
            echo "FAIL: allure-history/77 directory was not created"
            exit 1
          fi
          echo "PASS: allure-history/77 directory exists"

      - name: Assert executor.json was created with correct build URL
        run: |
          echo "Checking executor.json in allure-results..."
          # executor.json is moved into allure-results before report generation
          # After generation, it may be in allure-report or allure-history
          # Check allure-history/77 for executor info in the report
          if [ ! -d "allure-history/77" ]; then
            echo "FAIL: allure-history/77 not found"
            exit 1
          fi
          echo "PASS: report directory with run 77 exists"
