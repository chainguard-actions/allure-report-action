name: Test allure report generation with subfolder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up allure results and gh-pages directories
        run: |
          # Set up allure-results with test data
          mkdir -p "$GITHUB_WORKSPACE/allure-results"
          # Try to copy actual allure result files from action directory (UUID-prefixed)
          if [ -d "$GITHUB_WORKSPACE/action/allure-results" ]; then
            find -L "$GITHUB_WORKSPACE/action/allure-results" -name "*-result.json" \
              -exec cp {} "$GITHUB_WORKSPACE/allure-results/" \; 2>/dev/null || true
          fi
          # Fall back to fixture file if no results were copied
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/allure-results/")" ]; then
            cp "$GITHUB_WORKSPACE/tests/fixtures/allure-results/test-result.json" \
               "$GITHUB_WORKSPACE/allure-results/"
          fi

          # Create gh-pages with last-history dir populated with fixture history
          # When subfolder is used, the entrypoint also looks in gh-pages/<subfolder>/last-history
          mkdir -p "$GITHUB_WORKSPACE/gh-pages/last-history"
          cp "$GITHUB_WORKSPACE/tests/fixtures/last-history/history.json" \
             "$GITHUB_WORKSPACE/gh-pages/last-history/"
          mkdir -p "$GITHUB_WORKSPACE/gh-pages/myproject/last-history"
          cp "$GITHUB_WORKSPACE/tests/fixtures/last-history/history.json" \
             "$GITHUB_WORKSPACE/gh-pages/myproject/last-history/"

          # Create allure-results/history so cp -r works reliably
          mkdir -p "$GITHUB_WORKSPACE/allure-results/history"

          echo "Setup complete"
          ls -la "$GITHUB_WORKSPACE/allure-results/"
          ls -la "$GITHUB_WORKSPACE/gh-pages/last-history/"
          ls -la "$GITHUB_WORKSPACE/gh-pages/myproject/last-history/"

      - id: action
        uses: .
        continue-on-error: true
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          subfolder: 'myproject'
          keep_reports: '20'
          github_run_num: '100'
          github_run_id: '8888888'
          github_repo: 'myorg/myrepo'
          github_repo_owner: 'myorg'
          github_tests_repo: 'myorg/myrepo'
          github_server_url: 'https://github.com'

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking outputs..."
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker image build or allure generation issue)"
            exit 0
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert allure-report was generated
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking allure-report directory..."
          if [ ! -d "$GITHUB_WORKSPACE/allure-report" ]; then
            echo "FAIL: allure-report directory was not created"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/allure-report/index.html" ]; then
            echo "FAIL: allure-report/index.html not found"
            exit 1
          fi
          echo "PASS: allure-report/index.html exists"

      - name: Assert allure-history subfolder structure was created
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking allure-history/myproject directory..."
          if [ ! -d "$GITHUB_WORKSPACE/allure-history/myproject" ]; then
            echo "FAIL: allure-history/myproject subfolder was not created"
            exit 1
          fi
          echo "allure-history/myproject contents:"
          ls -la "$GITHUB_WORKSPACE/allure-history/myproject"
          if [ ! -d "$GITHUB_WORKSPACE/allure-history/myproject/100" ]; then
            echo "FAIL: allure-history/myproject/100 (run number subfolder) not found"
            exit 1
          fi
          echo "PASS: allure-history/myproject/100 exists"

      - name: Assert index.html redirect in subfolder contains correct URL
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking allure-history/myproject/index.html..."
          if [ ! -f "$GITHUB_WORKSPACE/allure-history/myproject/index.html" ]; then
            echo "FAIL: allure-history/myproject/index.html not found"
            exit 1
          fi
          CONTENT=$(cat "$GITHUB_WORKSPACE/allure-history/myproject/index.html")
          echo "index.html content: $CONTENT"
          if echo "$CONTENT" | grep -q "myproject"; then
            echo "PASS: index.html contains subfolder path"
          else
            echo "FAIL: index.html does not contain subfolder path"
            exit 1
          fi
          if echo "$CONTENT" | grep -q "100/index.html"; then
            echo "PASS: index.html contains redirect to run 100"
          else
            echo "FAIL: index.html does not contain expected redirect to run 100"
            exit 1
          fi

      - name: Assert last-history was copied in subfolder
        if: steps.action.outcome == 'success'
        run: |
          echo "Checking allure-history/myproject/last-history..."
          if [ ! -d "$GITHUB_WORKSPACE/allure-history/myproject/last-history" ]; then
            echo "FAIL: allure-history/myproject/last-history directory not found"
            exit 1
          fi
          echo "PASS: allure-history/myproject/last-history exists"
