name: Test allure report generation with subfolder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up allure-results with sample test data
        run: |
          mkdir -p allure-results
          cat > allure-results/test-result.json << 'EOF'
          {
            "uuid": "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee",
            "historyId": "test-history-id",
            "name": "Sample Test",
            "status": "passed",
            "stage": "finished",
            "start": 1700000000000,
            "stop": 1700000001000
          }
          EOF

      - name: Set up gh-pages directory with subfolder structure
        run: |
          mkdir -p gh-pages/my-suite/last-history
          mkdir -p gh-pages/last-history

      - id: action
        uses: .
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          subfolder: my-suite
          keep_reports: '20'
          github_run_num: '100'
          github_run_id: '8888888'
          github_repo: 'test-owner/test-repo'
          github_repo_owner: 'test-owner'
          github_tests_repo: 'test-owner/test-repo'
          github_server_url: 'https://github.com'

      - name: Assert allure-report was generated
        run: |
          echo "Checking allure-report directory..."
          if [ ! -d "$GITHUB_WORKSPACE/allure-report" ]; then
            echo "FAIL: allure-report directory not found"
            exit 1
          fi
          echo "PASS: allure-report directory exists"

      - name: Assert allure-history subfolder was created with run number
        run: |
          echo "Checking allure-history/my-suite/100 directory..."
          if [ ! -d "$GITHUB_WORKSPACE/allure-history/my-suite/100" ]; then
            echo "FAIL: allure-history/my-suite/100 directory not found"
            exit 1
          fi
          echo "PASS: allure-history/my-suite/100 directory exists"

      - name: Assert allure-history subfolder index.html contains subfolder URL
        run: |
          echo "Checking allure-history/my-suite/index.html..."
          if [ ! -f "$GITHUB_WORKSPACE/allure-history/my-suite/index.html" ]; then
            echo "FAIL: allure-history/my-suite/index.html not found"
            exit 1
          fi
          CONTENT=$(cat "$GITHUB_WORKSPACE/allure-history/my-suite/index.html")
          echo "Content: $CONTENT"
          if echo "$CONTENT" | grep -q "my-suite"; then
            echo "PASS: index.html contains subfolder path"
          else
            echo "FAIL: index.html does not contain subfolder path"
            exit 1
          fi
          if echo "$CONTENT" | grep -q "100/index.html"; then
            echo "PASS: index.html contains redirect to run 100"
          else
            echo "FAIL: index.html does not contain expected redirect to run 100"
            exit 1
          fi
